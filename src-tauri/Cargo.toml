[package]
name = "vidbase"
version = "0.2.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "vidbase"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vid_base_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["protocol-asset", "devtools"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-dialog = "2.7.3"
walkdir = "2.5.0"
tauri-plugin-fs = "2.5.2"
tauri-plugin-store = "2.4.5"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["process", "io-util"] }
tower-http = { version = "0.6.11", features = ["cors", "fs"] }
tauri-plugin-shell = "2.3.6"
async-stream = "0.3.6"
tokio-util = { version = "0.7.19", features = ["io-util"] }
discord-presence = "3.2.0"

[target.'cfg(windows)'.dependencies]
sysinfo = "0.30.13"
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.12.0"

[dev-dependencies]
tempfile = "3.27.0"

